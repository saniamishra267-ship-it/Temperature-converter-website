<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style3.css">
</head>

<body>

<div class="container">
  <h2>🌡 Temperature Converter</h2>

  <input type="text" id="temperature" placeholder="Enter temperature">

  <select id="unit">
    <option value="C">Celsius</option>
    <option value="F">Fahrenheit</option>
    <option value="K">Kelvin</option>
  </select>

  <button onclick="convertTemperature()">Convert</button>

  <div id="result"></div>
</div>

<script>
  function convertTemperature() {
    const tempInput = document.getElementById("temperature").value;
    const unit = document.getElementById("unit").value;
    const resultDiv = document.getElementById("result");

    const temp = parseFloat(tempInput);

    if (isNaN(temp)) {
      resultDiv.innerHTML = "<span class='error'>⚠ Please enter a valid number!</span>";
      return;
    }

    let resultText = "";

    if (unit === "C") {
      const f = (temp * 9/5) + 32;
      const k = temp + 273.15;
      resultText = `${temp}°C = ${f.toFixed(2)}°F | ${k.toFixed(2)}K`;
    } 
    else if (unit === "F") {
      const c = (temp - 32) * 5/9;
      const k = c + 273.15;
      resultText = `${temp}°F = ${c.toFixed(2)}°C | ${k.toFixed(2)}K`;
    } 
    else {
      const c = temp - 273.15;
      const f = (c * 9/5) + 32;
      resultText = `${temp}K = ${c.toFixed(2)}°C | ${f.toFixed(2)}°F`;
    }

    resultDiv.innerHTML = resultText;
  }
</script>

</body>
</html>
